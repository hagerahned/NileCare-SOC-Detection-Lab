title: NileCare - Failed Windows Logon (Brute Force Building Block)
name: nilecare_failed_logon
id: f930ff79-ef32-4932-a126-b2d5517b35fa
status: experimental
description: |
    Failed Windows logon (Event ID 4625) excluding local and empty sources.
    Building block for the correlation rule below, which alerts on 5 or more failures
    from the same source and account within 5 minutes.
    Linked risk: R-03 (credential theft and weak authentication).
    ISO 27001:2022: A.8.15 Logging, A.8.16 Monitoring activities, A.8.5 Secure authentication.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Hager
date: 2026-10-20
tags:
    - attack.credential-access
    - attack.t1110
    - iso27001.a.8.15
    - iso27001.a.8.16
    - nilecare.risk.r-03
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    filter_local:
        IpAddress:
            - '-'
            - '::1'
            - '127.0.0.1'
    condition: selection and not filter_local
falsepositives:
    - Users mistyping passwords
    - Service accounts with expired passwords
level: low
---
title: NileCare - Multiple Failed Logons From Same Source (Brute Force)
id: bcd810e3-03c3-4b4f-b2df-4dafbd49341d
status: experimental
description: |
    5 or more failed logons (Event ID 4625) from the same source IP against the same account
    within 5 minutes. Possible password guessing or credential stuffing against EMR or VPN-reachable hosts.
    Linked risk: R-03. ISO 27001:2022: A.8.16 Monitoring activities, A.8.5 Secure authentication.
author: Hager
date: 2026-10-20
tags:
    - attack.credential-access
    - attack.t1110
    - iso27001.a.8.16
    - nilecare.risk.r-03
correlation:
    type: event_count
    rules:
        - nilecare_failed_logon
    group-by:
        - IpAddress
        - TargetUserName
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - Misconfigured service accounts or scheduled tasks with old passwords
level: high
