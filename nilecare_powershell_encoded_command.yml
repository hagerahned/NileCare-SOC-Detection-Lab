title: NileCare - PowerShell Encoded Command Execution
id: 576559e1-35d9-494c-9e1b-7ecb7b73806d
status: experimental
description: |
    PowerShell started with an encoded command. Common after a phishing document or link runs a payload.
    Linked risk: R-03 (phishing leading to code execution).
    ISO 27001:2022: A.8.7 Protection against malware, A.8.16 Monitoring activities.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Hager
date: 2026-10-20
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
    - iso27001.a.8.7
    - iso27001.a.8.16
    - nilecare.risk.r-03
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -encodedcommand '
            - ' -ec '
    condition: all of selection_*
falsepositives:
    - Software deployment and management tools that use encoded commands
    - Administrator scripts (confirm the parent process and user)
level: medium
